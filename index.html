<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khel Adda Online</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--green:#5f9c8a;--ink:#2b2620;--muted:#7a7268;--bg:#f6f3ee;--card:#ffffff;--line:#e5dfd6;--red:#c25b4e;--gold:#c9a227}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.app{max-width:430px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:14px}
header{text-align:center;padding:6px 0}
header h1{font-size:26px;letter-spacing:.5px}
header h1 span{color:var(--green)}
.tag{font-size:12.5px;color:var(--muted);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
h2{font-size:18px}
.btn{background:var(--green);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;width:100%}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--red)}
.btn:disabled{opacity:.5}
input,select{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
label{font-size:13px;font-weight:600;color:var(--muted)}
.code{display:flex;gap:8px;align-items:center;justify-content:center;background:#efe9df;border-radius:12px;padding:12px;font-size:24px;font-weight:800;letter-spacing:6px}
.players{display:flex;flex-direction:column;gap:8px}
.pill{display:flex;align-items:center;gap:10px;background:#f4f0e8;border-radius:10px;padding:10px 12px;font-size:15px}
.pill .dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none}
.pill .host-tag{margin-left:auto;font-size:11px;color:var(--gold);font-weight:700}
.pill .me{margin-left:auto;font-size:11px;color:var(--muted)}
.pill .host-tag + .me{margin-left:6px}
.word-card{text-align:center;padding:28px 16px;border-radius:14px;font-size:26px;font-weight:800}
.word-card.spy{background:#fdeceb;color:var(--red)}
.word-card.citizen{background:#e8f4f0;color:var(--green)}
.timer{text-align:center;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
.chatlog{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;background:#f4f0e8;border-radius:12px;padding:10px}
.chatlog .msg{font-size:14px;line-height:1.35}
.chatlog .msg b{color:var(--green)}
.chatlog .sys{font-size:12px;color:var(--muted);font-style:italic;text-align:center}
.chatrow{display:flex;gap:8px}
.chatrow input{flex:1}
.chatrow .btn{width:auto;padding:13px 18px}
.vote-grid{display:flex;flex-direction:column;gap:8px}
.note{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
.big-emoji{font-size:44px;text-align:center}
.result-win{color:var(--green);text-align:center;font-size:20px;font-weight:800}
.result-lose{color:var(--red);text-align:center;font-size:20px;font-weight:800}
.status{font-size:13px;text-align:center;color:var(--muted)}
.status.err{color:var(--red)}
.row{display:flex;gap:8px}
.row > *{flex:1}
.hidden{display:none!important}
canvas.drawbox{width:100%;height:320px;background:#fff;border:1.5px solid var(--line);border-radius:12px;touch-action:none;cursor:crosshair}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatch.sel{border-color:var(--ink)}
.toolrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gametabs{display:flex;gap:8px}
.gametabs .btn{font-size:14px;padding:10px}
</style>
</head>
<body>
<div class="app">
<header><h1>Khel <span>Adda</span> Online</h1><div class="tag">Doston ke saath, alag-alag phones par. Free, bina signup.</div></header>
<div id="voicebar" class="card hidden" style="flex-direction:row;align-items:center;gap:10px;padding:10px 14px">
  <button class="btn ghost" id="voicebtn" style="width:auto;padding:9px 16px;font-size:14px">Mic: OFF</button>
  <div class="note" id="voicenote" style="text-align:left;flex:1">Voice chat (beta). Sabko ON karna hoga.</div>
  <div id="voiceaudios"></div>
</div>
<div id="screen"></div>
<div class="note" id="foot">Rooms chhote honge toh sabse smooth chalega (3-8 players). Net chahiye.</div>
</div>
<script>
"use strict";

const ICONS={
spy:'<svg viewBox="0 0 64 64" width="52" height="52" fill="none" stroke="#c25b4e" stroke-width="3.5" stroke-linecap="round"><path d="M14 26 L20 12 L32 20 L44 12 L50 26 Z" fill="#c25b4e" stroke="none"/><rect x="10" y="24" width="44" height="6" rx="3" fill="#c25b4e" stroke="none"/><circle cx="24" cy="40" r="7"/><circle cx="40" cy="40" r="7"/><path d="M17 40 L10 38 M47 40 L54 38 M31 40 L33 40"/></svg>',
secret:'<svg viewBox="0 0 64 64" width="52" height="52" fill="none" stroke="#5f9c8a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14 h40 v30 h-24 l-8 8 v-8 h-8 Z"/><text x="32" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#5f9c8a" stroke="none">?</text></svg>',
target:'<svg viewBox="0 0 64 64" width="52" height="52" fill="none" stroke="#2b2620" stroke-width="3.5"><circle cx="32" cy="32" r="20"/><circle cx="32" cy="32" r="11"/><circle cx="32" cy="32" r="3.5" fill="#c25b4e" stroke="none"/></svg>',
party:'<svg viewBox="0 0 64 64" width="52" height="52" fill="none" stroke="#5f9c8a" stroke-width="3.5" stroke-linecap="round"><path d="M18 44 L34 12 L46 18 L40 46 Z" fill="#e8f4f0"/><path d="M20 50 L42 50"/><path d="M14 10 l3 3 M50 8 l-2 4 M56 22 l-4 1 M10 26 l4 2"/><circle cx="52" cy="14" r="2" fill="#c9a227" stroke="none"/><circle cx="12" cy="18" r="2" fill="#c25b4e" stroke="none"/><circle cx="54" cy="34" r="2" fill="#5f9c8a" stroke="none"/></svg>',
devil:'<svg viewBox="0 0 64 64" width="52" height="52" fill="none" stroke="#c25b4e" stroke-width="3.5" stroke-linecap="round"><path d="M16 22 L10 8 L24 16 M48 22 L54 8 L40 16"/><circle cx="32" cy="38" r="17"/><circle cx="26" cy="35" r="2.2" fill="#c25b4e" stroke="none"/><circle cx="38" cy="35" r="2.2" fill="#c25b4e" stroke="none"/><path d="M24 45 q8 6 16 0"/></svg>',
wait:'<svg viewBox="0 0 64 64" width="44" height="44" fill="none" stroke="#7a7268" stroke-width="3.5" stroke-linecap="round"><path d="M18 8 h28 M18 56 h28 M20 8 c0 14 8 18 12 24 c-4 6 -12 10 -12 24 M44 8 c0 14 -8 18 -12 24 c4 6 12 10 12 24"/></svg>'
};

const $=s=>document.querySelector(s);
const screen=$('#screen');
const S={peer:null,conn:null,conns:{},isHost:false,code:'',me:{id:'',name:''},players:[],phase:'home',endAt:0,word:'',pack:'mixed',minutes:3,votes:{},accused:'',timerInt:null};

const PACKS={
mixed:['Chai','Cricket','Auto Rickshaw','Bollywood','Monsoon','Samosa','Diwali','Local Train','Gully Cricket','Pani Puri','Rickshawala','Shaadi','Holi','Cutting Chai','Jugaad','Dhaba','Ludo','Antakshari'],
food:['Biryani','Masala Dosa','Chole Bhature','Pav Bhaji','Momos','Jalebi','Butter Chicken','Pani Puri','Vada Pav','Rasgulla','Paratha','Dhokla','Idli','Samosa','Lassi','Pakora'],
places:['Taj Mahal','Goa Beach','Mumbai Local','Dilli Haat','Vaishno Devi','Marine Drive','Chandni Chowk','Hawa Mahal','Darjeeling','Varanasi Ghat','India Gate','Manali','Kerala Boat','Red Fort','Ooty','Amritsar'],
things:['Pressure Cooker','Balti','Jhadu','Tiffin Box','Torch','Khatiya','Cooler','Bucket','Mobile Charger','Chappal','Umbrella','Sewing Machine','Trunk','Lottery Ticket','Gas Cylinder','Bansuri']
};
function allWords(p){return p==='mixed'?PACKS.mixed:PACKS[p]||PACKS.mixed;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function mkCode(){const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function peerId(code){return 'khel-adda-room-'+code;}
const ICE={config:{iceServers:[
  {urls:['stun:stun.relay.metered.ca:80','stun:stun.l.google.com:19302']},
  {urls:'turn:standard.relay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:standard.relay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:standard.relay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turns:standard.relay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}
]},iceTransportPolicy:'all'};

function setStatus(msg,err){const el=$('#status');if(el){el.textContent=msg||'';el.className='status'+(err?' err':'');}}
function render(fn){if(S.timerInt){clearInterval(S.timerInt);S.timerInt=null;}screen.innerHTML='';fn(screen);window.scrollTo(0,0);}

/* ---------- HOME ---------- */
function uiHome(){render(el=>{el.innerHTML=`
<div class="card">
  <h2>Apna naam likho</h2>
  <input id="name" maxlength="16" placeholder="Naam" value="${esc(S.me.name)}">
</div>
<div class="card">
  <h2>Naya room</h2>
  <button class="btn" id="create">Room banao</button>
</div>
<div class="card">
  <h2>Dost ke room mein aao</h2>
  <input id="joincode" maxlength="4" placeholder="4-letter code" style="text-transform:uppercase">
  <button class="btn ghost" id="join">Room join karo</button>
  <div class="status" id="status"></div>
</div>`;
$('#name').addEventListener('input',e=>{S.me.name=e.target.value;});
$('#create').addEventListener('click',()=>{const n=S.me.name.trim();if(!n)return setStatus('Pehle naam likho',1);hostRoom(n);});
$('#join').addEventListener('click',()=>{const n=S.me.name.trim();const c=$('#joincode').value.trim().toUpperCase();if(!n)return setStatus('Pehle naam likho',1);if(c.length!==4)return setStatus('4-letter code daalo',1);joinRoom(n,c);});
$('#joincode').addEventListener('keydown',e=>{if(e.key==='Enter')$('#join').click();});
});}

/* ---------- HOST ---------- */
function hostRoom(name){
  S.code=mkCode();S.isHost=true;S.me.id='host';
  S.players=[{id:'host',name}];
  S.peer=new Peer(peerId(S.code),ICE);
  S.peer.on('open',()=>{wireIncomingCalls();uiLobby();});
  S.peer.on('error',e=>{console.warn(e);setStatus('Room nahi ban paya. Dobara try karo.',1);});
  S.peer.on('connection',conn=>{
    conn.on('data',msg=>{
      if(msg.t==='join'){
        conn._pname=String(msg.name||'Player').slice(0,16);
        S.conns[conn.peer]=conn;
        S.players.push({id:conn.peer,name:conn._pname});
        send(conn,{t:'welcome',id:conn.peer,code:S.code});
        bcastLobby();uiLobby();reconcileCalls();
      } else if(msg.t==='chat'){bcast({t:'chat',name:pname(conn.peer),text:String(msg.text).slice(0,140)});}
      else if(msg.t==='vote'){onVote(conn.peer,msg.vote);}
      else if(msg.t==='spyguess'){onSpyGuess(String(msg.word||''));}
      else if(msg.t==='guess'){if(!onDrawGuess(conn.peer,String(msg.text||'')))bcast({t:'chat',name:pname(conn.peer),text:String(msg.text).slice(0,140)});}
      else if(msg.t==='drawdone'){if(conn.peer===S.draw.drawer)endDrawRound('done');}
      else if(msg.t==='stroke'||msg.t==='clearcanvas'){if(conn.peer===S.draw.drawer){bcastRaw(msg);}}
    });
    conn.on('close',()=>{
      const i=S.players.findIndex(p=>p.id===conn.peer);
      const nm=i>=0?S.players[i].name:'';
      delete S.conns[conn.peer];
      if(i>0){S.players.splice(i,1);bcast({t:'sys',text:nm+' chala gaya'});bcastLobby();if(S.phase==='lobby')uiLobby();}
    });
  });
}
function pname(id){const p=S.players.find(p=>p.id===id);return p?p.name:'Player';}
function send(conn,msg){try{conn.send(msg);}catch(e){}}
function bcast(msg){Object.values(S.conns).forEach(c=>send(c,msg));if(msg.t==='chat')addChat(msg.name,msg.text);if(msg.t==='sys')addSys(msg.text);}
function bcastLobby(){bcast({t:'lobby',players:S.players.map(p=>({id:p.id,name:p.name}))});}

/* ---------- GUEST ---------- */
function joinRoom(name,code){
  S.isHost=false;S.code=code;
  S.peer=new Peer(ICE);
  S.peer.on('error',e=>{console.warn(e);setStatus('Connect nahi hua. Code sahi hai? Room abhi khula hai?',1);});
  S.peer.on('open',()=>{
    const conn=S.peer.connect(peerId(code),{reliable:true});
    S.conn=conn;
    conn.on('open',()=>{wireIncomingCalls();conn.send({t:'join',name});uiJoinWait();});
    conn.on('data',onGuestMsg);
    conn.on('close',()=>{uiHome();alert('Host ne room band kar diya ya net cut gaya.');});
    setTimeout(()=>{if(S.phase==='home')setStatus('Room mila nahi. Code check karke dobara try karo.',1);},8000);
  });
}
function onGuestMsg(m){
  if(m.t==='welcome'){S.me.id=m.id;}
  else if(m.t==='lobby'){S.players=m.players;if(S.phase==='joinwait'||S.phase==='lobby')uiLobby();reconcileCalls();}
  else if(m.t==='start'){S.pack=m.pack;S.minutes=m.minutes;}
  else if(m.t==='role'){S.word=m.word;S.phase='role';uiRole();}
  else if(m.t==='discuss'){S.endAt=m.endAt;S.phase='discuss';uiDiscuss();}
  else if(m.t==='votephase'){S.endAt=m.endAt;S.phase='vote';uiVote();}
  else if(m.t==='chat'){addChat(m.name,m.text);}
  else if(m.t==='sys'){addSys(m.text);}
  else if(m.t==='result'){uiResult(m);}
  else if(m.t==='spyguesstime'){uiSpyGuessWait(m.spyName);}
}

/* ---------- JOIN WAIT ---------- */
function uiJoinWait(){S.phase='joinwait';render(el=>{el.innerHTML=`
<div class="card" style="text-align:center"><div class="big-emoji">${ICONS.wait}</div><h2>Room mein ja rahe ho...</h2><div class="note">Host ka room milte hi lobby khulegi.</div><div class="status err" id="status"></div></div>`;});
setTimeout(()=>{if(S.phase==='joinwait'){const st=$('#status');if(st)st.textContent='Connect nahi ho raha. Net check karo aur dobara try karo.';}},15000);}

/* ---------- LOBBY ---------- */
function uiLobby(){
  S.phase='lobby';showVoiceBar();
  render(el=>{el.innerHTML=`
<div class="card" style="text-align:center">
  <h2>Room code</h2>
  <div class="code">${S.code}</div>
  <div class="note">Doston ko ye code do. Sab apne phone par khelenge.</div>
</div>
<div class="card">
  <h2>Players (${S.players.length})</h2>
  <div class="players">${S.players.map(p=>`<div class="pill"><span class="dot"></span>${esc(p.name)}${p.id==='host'?'<span class="host-tag">HOST</span>':''}${p.id===S.me.id?'<span class="me">(tum)</span>':''}</div>`).join('')}</div>
</div>
${S.isHost?`
<div class="card">
  <h2>Game settings</h2>
  <div class="gametabs">
    <button class="btn" id="tab-spy">Kaun Spy Hai</button>
    <button class="btn ghost" id="tab-draw">Banao aur Guess Karo</button>
  </div>
  <div id="spysettings">
  <label>Word pack</label>
  <select id="pack">
    <option value="mixed">Mixed (sab kuch)</option>
    <option value="food">Khana</option>
    <option value="places">Jagah</option>
    <option value="things">Ghar ki cheezein</option>
  </select>
  <label>Discussion time</label>
  <select id="minutes"><option value="2">2 min</option><option value="3" selected>3 min</option><option value="5">5 min</option></select>
  </div>
  <button class="btn" id="start" ${S.players.length<3?'disabled':''}>Game shuru karo${S.players.length<3?' (kam se kam 3 players)':''}</button>
  <div class="note">Spy game mein 3-8 players best. Draw game 2-8 players.</div>
</div>`:`
<div class="card"><div class="note">Host game shuru karega. Pack aur time host chunta hai.</div></div>`}`;
  if(S.isHost){window._gameSel=wireGameTabs();const b=$('#start');if(b)b.addEventListener('click',startGame);}
});}
function wireGameTabs(){
  let sel='spy';
  const ts=$('#tab-spy'),td=$('#tab-draw');
  const paint=()=>{ts.className='btn '+(sel==='spy'?'':'ghost');td.className='btn '+(sel==='draw'?'':'ghost');$('#spysettings').style.display=sel==='spy'?'':'none';};
  ts.addEventListener('click',()=>{sel='spy';paint();});
  td.addEventListener('click',()=>{sel='draw';paint();});
  paint();
  return ()=>sel;
}
function startGame(){
  if(window._gameSel&&window._gameSel()==='draw'){startDrawGame();return;}
  S.pack=$('#pack').value;S.minutes=parseInt($('#minutes').value,10);
  const words=allWords(S.pack);
  const word=words[Math.floor(Math.random()*words.length)];
  const spyIdx=Math.floor(Math.random()*S.players.length);
  S.players.forEach((p,i)=>{
    const roleMsg={t:'role',word:i===spyIdx?'':word,spy:i===spyIdx};
    if(p.id==='host'){S.word=i===spyIdx?'':word;S.me.spy=i===spyIdx;}
    else send(S.conns[p.id],roleMsg);
  });
  bcast({t:'start',pack:S.pack,minutes:S.minutes});
  S.secretWord=word;S.spyId=S.players[spyIdx].id;
  S.phase='role';uiRole();
  setTimeout(()=>{S.endAt=Date.now()+S.minutes*60000;bcast({t:'discuss',endAt:S.endAt});S.phase='discuss';uiDiscuss();},9000);
}

/* ---------- ROLE REVEAL ---------- */
function uiRole(){render(el=>{
  const spy=S.isHost?S.me.spy:(S.word==='');
  el.innerHTML=`
<div class="card" style="text-align:center;gap:16px">
  <div class="big-emoji">${spy?ICONS.spy:ICONS.secret}</div>
  ${spy?`<div class="word-card spy">TUM SPY HO!</div><div class="note">Tumhe word nahi pata. Baaton se guess karo, pakde mat jao!</div>`
      :`<div class="note">Tumhara word hai:</div><div class="word-card citizen">${esc(S.word)}</div><div class="note">Spy ko mat batao. Sab isi word ke aas-paas baat karenge.</div>`}
  <div class="note">Kuch hi second mein discussion shuru hoga...</div>
</div>`;
});}

/* ---------- DISCUSSION ---------- */
function uiDiscuss(){showVoiceBar();render(el=>{el.innerHTML=`
<div class="card">
  <h2 style="text-align:center">Discussion chal rahi hai</h2>
  <div class="timer" id="t">--:--</div>
  <div class="note">Aapas mein baat karo: word ke baare mein hints do, spy ko pakdo. Neeche likh kar bhi baat kar sakte ho.</div>
</div>
<div class="card">
  <div class="chatlog" id="chatlog"></div>
  <div class="chatrow"><input id="chatin" maxlength="140" placeholder="Message likho..."><button class="btn" id="sendchat">Bhejo</button></div>
</div>
${S.isHost?'<button class="btn danger" id="tovote">Voting shuru karo</button>':'<div class="note">Time khatam hone par voting shuru hogi.</div>'}`;
wireChat();
$('#tovote')?.addEventListener('click',beginVote);
startTimer(()=>{if(S.isHost)beginVote();});
});}
function wireChat(){
  const inp=$('#chatin');
  const sendChat=()=>{const v=inp.value.trim();if(!v)return;inp.value='';
    if(S.isHost)bcast({t:'chat',name:S.players[0].name,text:v.slice(0,140)});
    else S.conn&&S.conn.send({t:'chat',text:v});};
  $('#sendchat').addEventListener('click',sendChat);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});
}
function addChat(name,text){const l=$('#chatlog');if(!l)return;const d=document.createElement('div');d.className='msg';d.innerHTML=`<b>${esc(name)}:</b> ${esc(text)}`;l.appendChild(d);l.scrollTop=l.scrollHeight;}
function addSys(text){const l=$('#chatlog');if(!l)return;const d=document.createElement('div');d.className='sys';d.textContent=text;l.appendChild(d);l.scrollTop=l.scrollHeight;}
function startTimer(onEnd){
  const tick=()=>{const left=Math.max(0,S.endAt-Date.now());const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
    const t=$('#t');if(t){t.textContent=m+':'+String(s).padStart(2,'0');t.className='timer'+(left<30000?' low':'');}
    if(left<=0){clearInterval(S.timerInt);S.timerInt=null;onEnd&&onEnd();}};
  tick();S.timerInt=setInterval(tick,500);
}

/* ---------- VOTING ---------- */
function beginVote(){
  if(!S.isHost)return;
  S.votes={};
  S.endAt=Date.now()+45000;
  bcast({t:'votephase',endAt:S.endAt});
  S.phase='vote';uiVote();
}
function onVote(from,vote){
  if(S.phase!=='vote')return;
  S.votes[from]=String(vote);
  bcast({t:'sys',text:pname(from)+' ne vote kiya'});
  if(Object.keys(S.votes).length>=S.players.length)finishVote();
}
function finishVote(){
  const tally={};
  Object.values(S.votes).forEach(v=>{tally[v]=(tally[v]||0)+1;});
  let top='',topN=0;
  for(const[id,n]of Object.entries(tally)){if(n>topN){topN=n;top=id;}}
  S.accused=top;
  if(top===S.spyId){
    bcast({t:'spyguesstime',spyName:pname(S.spyId)});
    uiSpyGuessWait(pname(S.spyId));
    setTimeout(()=>{if(S.phase==='vote')onSpyGuess('__timeout__');},30000);
  } else {
    endRound(false,'');
  }
}
function onSpyGuess(guess){
  if(S.phase!=='vote')return;
  const win=guess.trim().toLowerCase()===S.secretWord.toLowerCase();
  endRound(win,guess==='__timeout__'?'':guess);
}
function endRound(spyEscaped,guess){
  const r={t:'result',spyName:pname(S.spyId),word:S.secretWord,accused:pname(S.accused),
    spyCaught:S.accused===S.spyId,spyEscaped,guess};
  bcast(r);uiResult(r);
}

/* ---------- VOTE UI ---------- */
function uiVote(){showVoiceBar();render(el=>{el.innerHTML=`
<div class="card">
  <h2 style="text-align:center">Kaun hai Spy?</h2>

</div>
<div class="card"><div class="vote-grid">
${S.players.filter(p=>p.id!==S.me.id).map(p=>`<button class="btn ghost" data-v="${p.id}">${esc(p.name)}</button>`).join('')}
</div><div class="note" id="voted"></div></div>
<div class="card"><div class="chatlog" id="chatlog"></div></div>`;
startTimer(()=>{if(S.isHost)finishVote();});
el.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{
  const v=b.getAttribute('data-v');
  if(S.isHost){onVote('host',v);}else{S.conn&&S.conn.send({t:'vote',vote:v});}

  $('#voted').textContent='Vote ho gaya. Baaki players ka intezaar...';
}));
});}

/* ---------- SPY GUESS / RESULT ---------- */
function uiSpyGuessWait(spyName){render(el=>{el.innerHTML=`
<div class="card" style="text-align:center;gap:14px">
  <div class="big-emoji">${ICONS.target}</div>
  <h2>${esc(spyName)} spy nikla!</h2>
  ${S.isHost&&S.spyId==='host'||(!S.isHost&&S.spyId===S.me.id)?`
    <div class="note">Aakhri mauka: word guess karo toh tum jeet jaoge!</div>
    <input id="sg" maxlength="30" placeholder="Word guess karo">
    <button class="btn" id="sgbtn">Guess karo</button>`
  :`<div class="note">Spy ka aakhri mauka: agar usne word guess kar liya toh woh jeet jayega. 30 second...</div>`}
</div>`;
  const go=()=>{const w=($('#sg')||{}).value||'';if(S.isHost)onSpyGuess(w);else S.conn&&S.conn.send({t:'spyguess',word:w});};

function uiResult(r){S.phase='result';render(el=>{
  const citizensWin=r.spyCaught&&!r.spyEscaped;
  el.innerHTML=`
<div class="card" style="text-align:center;gap:12px">

    :`<div class="note">${esc(r.accused)} spy nahi tha. Spy bach nikla!</div>`}
</div>
${S.isHost?'<button class="btn" id="again">Naya round (naya word, naya spy)</button>':''}
<button class="btn ghost" id="leave">Room chhodo</button>`;
$('#again')?.addEventListener('click',()=>{startGame();});
$('#leave').addEventListener('click',()=>{try{S.peer&&S.peer.destroy();}catch(e){}location.reload();});
});}

/* ---------- VOICE (WebRTC audio mesh) ---------- */
S.voiceOn=false;S.localStream=null;S.calls={};S.voicePeers={};
function syncVoiceUI(){
  const b=$('#voicebtn');if(!b)return;
  const n=Object.keys(S.voicePeers).length;
  b.textContent='Mic: '+(S.voiceOn?'ON':'OFF');
  b.className='btn '+(S.voiceOn?'':'ghost');
  b.style.width='auto';b.style.padding='9px 16px';b.style.fontSize='14px';
  $('#voicenote').textContent=S.voiceOn?(n>0?n+' voice juda/jude hain':'Mic on hai, doosre players ka intezaar...'):'Voice chat (beta). Sabko ON karna hoga.';
}
function showVoiceBar(){$('#voicebar').classList.remove('hidden');const b=$('#voicebtn');if(!b._wired){b._wired=true;b.addEventListener('click',toggleVoice);}syncVoiceUI();}
async function toggleVoice(){
  if(S.voiceOn){S.voiceOn=false;
    Object.values(S.calls).forEach(c=>{try{c.close();}catch(e){}});
    S.calls={};S.voicePeers={};$('#voiceaudios').innerHTML='';
    if(S.localStream){S.localStream.getTracks().forEach(t=>t.stop());S.localStream=null;}
    syncVoiceUI();return;}
  try{
    S.localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(e){$('#voicenote').textContent='Mic permission nahi mili. Browser settings mein allow karo.';return;}
  S.voiceOn=true;syncVoiceUI();reconcileCalls();
}
function reconcileCalls(){
  if(!S.voiceOn||!S.localStream||!S.peer)return;
  const myId=S.isHost?peerId(S.code):S.peer.id;
  S.players.forEach(p=>{
    const theirId=p.id==='host'?peerId(S.code):p.id;
    if(theirId===myId)return;
    if(S.calls[theirId])return;
    if(myId<theirId){startCall(theirId);}
  });
}
function startCall(theirId){
  try{
    const call=S.peer.call(theirId,S.localStream);
    wireCall(call,theirId);
  }catch(e){console.warn('call fail',e);}
}
function wireCall(call,theirId){
  if(!call)return;
  S.calls[theirId]=call;
  call.on('stream',remote=>{
    S.voicePeers[theirId]=true;syncVoiceUI();
    let a=document.getElementById('aud-'+theirId);
    if(!a){a=document.createElement('audio');a.id='aud-'+theirId;a.autoplay=true;a.playsInline=true;$('#voiceaudios').appendChild(a);}
    a.srcObject=remote;a.play().catch(()=>{});
  });
  call.on('close',()=>{delete S.calls[theirId];delete S.voicePeers[theirId];const a=document.getElementById('aud-'+theirId);if(a)a.remove();syncVoiceUI();});
  call.on('error',()=>{delete S.calls[theirId];delete S.voicePeers[theirId];syncVoiceUI();});
}
function wireIncomingCalls(){
  S.peer.on('call',call=>{
    if(!S.voiceOn||!S.localStream){try{call.close();}catch(e){}return;}
    call.answer(S.localStream);
    wireCall(call,call.peer);
  });
}

/* ---------- BANAO AUR GUESS KARO (online) ---------- */
const DRAW_WORDS=['Chai','Rickshaw','Cricket Bat','Diwali Diya','Auto','Kite','Samosa','Auto Rickshaw','Taj Mahal','Cycle','Chappal','Pressure Cooker','Cow','Mango','Train','Umbrella','Jugaad','Baraat','Ludo','Hawa Mahal'];
const DRAW_COLORS=['#2b2620','#c25b4e','#5f9c8a','#c9a227','#4a6fa5','#8e5ea2'];
S.draw={round:0,drawer:'',word:'',scores:{},strokes:[],color:'#2b2620',size:4,drawing:false,guessed:{}};

function startDrawGame(){
  S.draw.scores={};S.players.forEach(p=>S.draw.scores[p.id]=0);
  S.draw.order=S.players.map(p=>p.id);
  S.draw.round=0;
  bcast({t:'drawlobby',total:S.draw.order.length});
  nextDrawRound();
}
function nextDrawRound(){
  if(S.draw.round>=S.draw.order.length){
    const sc=S.players.map(p=>({name:p.name,score:S.draw.scores[p.id]||0})).sort((a,b)=>b.score-a.score);
    bcast({t:'drawfinal',scores:sc});
    uiDrawFinal(sc);return;
  }
  const drawerId=S.draw.order[S.draw.round];
  S.draw.drawer=drawerId;
  S.draw.word=DRAW_WORDS[Math.floor(Math.random()*DRAW_WORDS.length)];
  S.draw.guessed={};
  S.draw.strokes=[];
  S.endAt=Date.now()+60000;
  S.draw.displayRound=S.draw.round+1;
  bcast({t:'drawstart',drawer:drawerId,drawerName:pname(drawerId),endAt:S.endAt,round:S.draw.round+1,total:S.draw.order.length});
  if(drawerId==='host')S.draw.myword=S.draw.word;
  else send(S.conns[drawerId],{t:'drawword',word:S.draw.word});
  uiDraw(drawerId==='host');
}
function endDrawRound(reason){
  if(S.phase!=='draw')return;
  S.phase='drawend';
  S.draw.round++;
  bcast({t:'drawend',word:S.draw.word,reason});
  bcastScores();
  setTimeout(nextDrawRound,6000);
}
function bcastScores(){
  const sc=S.players.map(p=>({name:p.name,score:S.draw.scores[p.id]||0}));
  bcast({t:'drawscores',scores:sc});
}
function onDrawGuess(fromId,text){
  if(S.phase!=='draw')return false;
  const guess=text.trim().toLowerCase();
  if(guess===S.draw.word.toLowerCase()&&!S.draw.guessed[fromId]&&fromId!==S.draw.drawer){
    S.draw.guessed[fromId]=true;
    S.draw.scores[fromId]=(S.draw.scores[fromId]||0)+2;
    S.draw.scores[S.draw.drawer]=(S.draw.scores[S.draw.drawer]||0)+1;
    bcast({t:'sys',text:pname(fromId)+' ne sahi guess kiya! (+2)'});
    bcastScores();
    if(Object.keys(S.draw.guessed).length>=S.players.length-1)endDrawRound('allguessed');
    return true;
  }
  return false;
}

/* guest message handling for draw */
const _oldGuestMsg = onGuestMsg;
onGuestMsg = function(m){
  if(m.t==='drawlobby'){S.draw.total=m.total;}
  else if(m.t==='drawstart'){S.draw.drawer=m.drawer;S.endAt=m.endAt;S.draw.displayRound=m.round;S.draw.total=m.total;S.draw.myword='';S.phase='draw';uiDraw(m.drawer===S.me.id);}
  else if(m.t==='drawword'){S.draw.myword=m.word;const w=$('#drawword');if(w)w.textContent='Tumhara word: '+m.word;}
  else if(m.t==='stroke'){if(!(S.draw.drawer===S.me.id))paintStroke(m);}
  else if(m.t==='clearcanvas'){const c=$('#cv');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);}
  else if(m.t==='drawscores'){renderDrawScores(m.scores);}
  else if(m.t==='drawend'){showDrawEnd(m.word);}
  else if(m.t==='drawfinal'){uiDrawFinal(m.scores);}
  else if(m.t==='backtolobby'){uiLobby();}
  else {_oldGuestMsg(m);}
};

function uiDraw(iAmDrawer){
  S.phase='draw';
  render(el=>{
    el.innerHTML=`
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2>Round ${S.draw.displayRound}/${S.draw.total}</h2>
    <div class="timer" id="t">--:--</div>
  </div>
  <div class="note" id="drawword">${iAmDrawer?('Tumhara word: '+(S.draw.myword||'...')):(esc(pnameSafe(S.draw.drawer))+' draw kar raha/rahi hai. Guess karo!')}</div>
  <canvas id="cv" class="drawbox" width="380" height="320"></canvas>
  ${iAmDrawer?`
  <div class="toolrow">
    <div class="swatches">${DRAW_COLORS.map(c=>`<div class="swatch${c==='#2b2620'?' sel':''}" data-c="${c}" style="background:${c}"></div>`).join('')}</div>
  </div>
  <div class="toolrow">
    <button class="btn ghost" id="thin" style="width:auto;padding:8px 14px">Patla</button>
    <button class="btn ghost" id="thick" style="width:auto;padding:8px 14px">Motaa</button>
    <button class="btn ghost" id="clearcv" style="width:auto;padding:8px 14px">Saaf karo</button>
    <button class="btn" id="done" style="width:auto;padding:8px 14px">Ho gaya</button>
  </div>`:''}
</div>
<div class="card">
  <div id="drawscores" class="players"></div>
  <div class="chatlog" id="chatlog"></div>
  <div class="chatrow"><input id="chatin" maxlength="140" placeholder="${iAmDrawer?'Baat karo...':'Apna guess likho...'}"><button class="btn" id="sendchat">Bhejo</button></div>
</div>`;
    wireDrawCanvas(iAmDrawer);
    wireDrawChat(iAmDrawer);
    startTimer(()=>{if(S.isHost)endDrawRound('time');});
  });
}
function pnameSafe(id){const p=S.players.find(p=>p.id===id);return p?p.name:'Player';}
function wireDrawChat(iAmDrawer){
  const inp=$('#chatin');
  const go=()=>{const v=inp.value.trim();if(!v)return;inp.value='';
    if(S.isHost){
      if(!onDrawGuess('host',v))bcast({t:'chat',name:S.players[0].name,text:v.slice(0,140)});
    } else {
      S.conn&&S.conn.send({t:'guess',text:v});
    }};
  $('#sendchat').addEventListener('click',go);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
}
function wireDrawCanvas(iAmDrawer){
  const cv=$('#cv');if(!cv)return;
  const ctx=cv.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';
  if(!iAmDrawer){cv.style.cursor='default';return;}
  let last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*(cv.width/r.width),y:(e.clientY-r.top)*(cv.height/r.height)};};
  const stroke=(type,p)=>{
    const msg={t:'stroke',type,x:Math.round(p.x),y:Math.round(p.y),color:S.draw.color,size:S.draw.size};
    paintStroke(msg);
    if(S.isHost)bcastRaw(msg);else S.conn&&S.conn.send(msg);
  };
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);S.draw.drawing=true;last=pos(e);stroke('start',last);});
  cv.addEventListener('pointermove',e=>{if(!S.draw.drawing)return;const p=pos(e);stroke('move',p);last=p;});
  const up=e=>{if(!S.draw.drawing)return;S.draw.drawing=false;stroke('end',last||pos(e));};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  document.querySelectorAll('.swatch').forEach(sw=>sw.addEventListener('click',()=>{
    document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel'));sw.classList.add('sel');S.draw.color=sw.getAttribute('data-c');}));
  $('#thin').addEventListener('click',()=>{S.draw.size=3;});
  $('#thick').addEventListener('click',()=>{S.draw.size=9;});
  $('#clearcv').addEventListener('click',()=>{ctx.clearRect(0,0,cv.width,cv.height);const m={t:'clearcanvas'};if(S.isHost)bcastRaw(m);else S.conn&&S.conn.send(m);});
  $('#done').addEventListener('click',()=>{if(S.isHost)endDrawRound('done');else S.conn&&S.conn.send({t:'drawdone'});});
}
function bcastRaw(msg){Object.values(S.conns).forEach(c=>send(c,msg));}
function paintStroke(m){
  const cv=$('#cv');if(!cv)return;
  const ctx=cv.getContext('2d');
  ctx.strokeStyle=m.color||'#2b2620';ctx.lineWidth=m.size||4;ctx.lineCap='round';ctx.lineJoin='round';
  if(m.type==='start'){ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x+0.1,m.y+0.1);ctx.stroke();}
  else if(m.type==='move'){ctx.lineTo(m.x,m.y);ctx.stroke();}
  else if(m.type==='end'){ctx.closePath();}
}
function renderDrawScores(sc){
  const d=$('#drawscores');if(!d)return;
  d.innerHTML=sc.map(p=>`<div class="pill"><span class="dot"></span>${esc(p.name)}<span class="me">${p.score} pts</span></div>`).join('');
}
function showDrawEnd(word){
  const w=$('#drawword');if(w)w.textContent='Word tha: '+word+'. Agla round aa raha hai...';
}
function uiDrawFinal(sc){
  S.phase='drawfinal';
  render(el=>{
    const top=sc[0];
    el.innerHTML=`
<div class="card" style="text-align:center;gap:12px">
  <div class="big-emoji">${ICONS.party}</div>
  <div class="result-win">${esc(top.name)} jeet gaye!</div>
</div>
<div class="card"><h2>Final scores</h2><div class="players">
${sc.map((p,i)=>`<div class="pill"><span class="dot"></span>${i+1}. ${esc(p.name)}<span class="me">${p.score} pts</span></div>`).join('')}
</div></div>
${S.isHost?'<button class="btn" id="again">Naya game (lobby wapas)</button>':''}
<button class="btn ghost" id="leave">Room chhodo</button>`;
    $('#again')?.addEventListener('click',()=>{bcastLobby();bcast({t:'backtolobby'});uiLobby();});
    $('#leave').addEventListener('click',()=>{try{S.peer&&S.peer.destroy();}catch(e){}location.reload();});
  });
}

uiHome();
</script>
